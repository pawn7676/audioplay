# The checks CLAUDE.md already requires, run by GitHub
# instead of by whoever remembered. Nothing here is new and
# nothing here is clever: it is the same commands, on a
# machine that never forgets.
#
# It earns its keep on edits made in GitHub's web UI, where
# there is no terminal and the harness CANNOT be run at all -
# until now those reached the live page unchecked. Same for
# any commit pushed in a hurry.
#
# No dependencies, by the project's own rule. Node ships with
# the runner; the harness and perft need nothing else.
name: checks

on:
  push:
    branches: [main]     # the deploy branch - hand edits land here
  pull_request:          # and every proposed change before it does

permissions:
  contents: read         # this workflow only ever reads the repo

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Stubs a browser, boots the page, drives it. Exits
      # non-zero on any failure, which is what fails the run.
      - name: test harness
        run: node test_harness.js

      # Move generation against known counts. CLAUDE.md only
      # asks for this when rules.js changes; it takes
      # seconds, so it always runs rather than resting on a
      # condition being written correctly.
      - name: perft
        run: node perft_check.js

      # THE INVARIANTS, on utterances nobody chose. Random games
      # supply the positions, the whole spoken grammar supplies
      # the sentences, and rules that must hold whatever was said
      # are checked against every combination. It guards the one
      # thing the harness structurally cannot: a sentence nobody
      # thought to write a test for, quietly becoming a move.
      #
      # 150 positions is ~56k utterances in four seconds. The
      # count is an argument, so raise it when the grammar grows:
      # "node property_check.js 900" is 340k in twenty.
      - name: properties
        run: node property_check.js

      # The page itself is NOT checked here any more, because
      # there is nothing left to check: index.html is no
      # longer committed. deploy.yml builds it on the way to
      # Pages, so the deployed page cannot disagree with src/
      # - the job that used to live here existed only to catch
      # that disagreement.
      #
      # What is still worth proving is that the build RUNS:
      # a manifest naming a file that does not exist, or a
      # template whose AUDIOPLAY_JS line went missing, would
      # otherwise first be discovered by a failed deploy.
      - name: the page still builds
        run: node build.js manifest.txt "$RUNNER_TEMP/page.html"
