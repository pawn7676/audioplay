# The deploy. Pages serves what THIS workflow publishes, not
# what is committed - so index.html is no longer in the repo
# at all.
#
# WHY IT MOVED. The page is generated by build.js, but it used
# to be committed by hand, which meant the deployed page could
# quietly disagree with src/: Pages kept serving the last
# build while the source said something else. That is the w18
# shape - an edit that did not land, failing silently - and
# checks.yml carried a whole job whose only job was to catch
# it. Building here instead removes the thing that could
# drift. There is nothing to keep in sync, so nothing can fall
# out of sync, and src/ is now the only place the page exists.
#
# The build is still the same dumb concatenation it has always
# been, run the same way you would run it locally. No
# dependencies, by the project's own rule: node ships with the
# runner.
#
# ONE SETTING MAKES THIS REAL: Settings -> Pages -> Source
# must be "GitHub Actions". With it set to a branch, Pages
# ignores everything below and serves a repo that no longer
# contains a page.
name: deploy

on:
  push:
    branches: [main]     # nothing is live until it reaches main
  workflow_dispatch:     # and a re-deploy on demand, changing nothing

permissions:
  contents: read
  pages: write           # publish the artifact
  id-token: write        # deploy-pages authenticates with OIDC

# Never two deploys at once, and a newer push wins. Cancelling
# a RUNNING deploy is not allowed here on purpose: a half
# published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The harness runs on every push to main already, but it
      # runs in a DIFFERENT workflow, and GitHub will happily
      # deploy while that one is failing. A page that speaks
      # moves to someone standing at a board is worth the
      # thirty seconds: nothing is published unless the tests
      # that guard it passed on the very commit being
      # published.
      - name: test harness
        run: node test_harness.js
      - name: perft
        run: node perft_check.js

      # Build into an empty directory rather than the checkout,
      # so whatever ships is exactly what build.js wrote and
      # nothing else - no src/, no node_modules, no history.
      - name: build the page
        run: |
          mkdir -p _site
          node build.js manifest.txt _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
