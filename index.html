<!doctype html>

<!-- index.html - the site's front door. It only sends you on
     to audioplay.html, so the short address
     (pawn7676.github.io/audioplay/) opens the app. Without
     it, GitHub Pages shows README.md here instead.

     The page itself stays audioplay.html: sign-in returns
     there (redirectUri() in lichess.js), and the home-screen
     icon should be added from there. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>audioplay</title>
<!-- the fallback, if scripts are off -->
<meta http-equiv="refresh" content="0; url=audioplay.html">
<script>location.replace("audioplay.html");</script>
<!-- the app's own background, so there is no white flash -->
<style>
  body { background: #161512; color: #888888;
         font-family: system-ui, sans-serif; padding: 24px; }
  a { color: #91bddf; }
</style>
</head>
<body>
<p><a href="audioplay.html">Open audioplay</a></p>
</body>
</html>
